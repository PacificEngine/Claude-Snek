<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div class="scores">
        <span>Score: <strong id="score">0</strong></span>
        <span id="best-wrap">Best: <strong id="best">0</strong></span>
      </div>
      <button id="difficulty-open" type="button" aria-label="Difficulty: Medium, choose difficulty">Difficulty: Medium</button>
      <button id="mute" type="button" data-action="mute" aria-pressed="false" aria-label="Mute (M)">Mute (M)</button>
      <select id="soundtrack-select" aria-label="Soundtrack"></select>
    </header>
    <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>
    <p id="message" role="status">Press an arrow key or WASD, or tap a direction, to start</p>
    <div class="controls" role="group" aria-label="Touch controls">
      <div class="dpad">
        <button type="button" class="up" data-action="direction" data-direction="up" aria-label="Up">&#9650;&#xFE0E;</button>
        <button type="button" class="left" data-action="direction" data-direction="left" aria-label="Left">&#9664;&#xFE0E;</button>
        <button type="button" class="right" data-action="direction" data-direction="right" aria-label="Right">&#9654;&#xFE0E;</button>
        <button type="button" class="down" data-action="direction" data-direction="down" aria-label="Down">&#9660;&#xFE0E;</button>
      </div>
      <div class="side">
        <button type="button" data-action="pause" aria-label="Pause or resume">Pause</button>
        <button type="button" data-action="restart" aria-label="Restart game">Restart</button>
      </div>
    </div>
    <p class="help">P pause · Enter restart · M mute</p>
  </main>
    <dialog id="difficulty-dialog" aria-labelledby="difficulty-title">
      <h2 id="difficulty-title">Difficulty</h2>
      <label class="picker">Difficulty
        <select id="difficulty-select" aria-label="Difficulty">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
          <option value="frantic">Frantic</option>
          <option value="random">Random</option>
          <option value="custom">Custom</option>
        </select>
      </label>
      <p id="difficulty-note"></p>
      <div id="difficulty-fields"></div>
      <div class="dialog-actions">
        <button id="difficulty-apply" type="button" aria-label="Apply difficulty and start a new game">Apply &amp; restart</button>
        <button id="difficulty-cancel" type="button" aria-label="Close without changing">Cancel</button>
      </div>
    </dialog>
  <script type="module" src="src/main.js"></script>
</body>
</html>
